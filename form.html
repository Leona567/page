    <main>
        <form action="contact-form">
            <div class="form_item">
                <label for="topic">Тема</label>
                <select name="topic" id="topic">
                    <option value="1">Заказать услугу</option>
                    <option value="2">Оставить отзыв/замечание</option>
                    <option value="3">Предложить сотрудничество</option>
                    <option value="4">Другое</option>
                </select>
            </div>
        <div class="form_item">
            <label for="name">Имя</label><br>
        <input name="name" id="name" type="text" placeholder="Введите ваше имя" required>
        </div>
        <div class="form_item">
            <label for="E-mail">E-mail</label><br>
        <input  name="email" id="email" type="email" placeholder="Введите вашу почту" required>
        </div>
        <div class="form_item">
            <label for="message">Текст сообщения</label><br>
            <textarea name="message" id="message" rows="6" placeholder="Напишите ваше сообщение" required></textarea>
        </div>
        <div class="form_item">
        <input type="submit">
        </div>
        </form>
    </main>
